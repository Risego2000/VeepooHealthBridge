workflows:
  ios-diagnostic:
    name: Veepoo Bridge - iOS validation (unsigned)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
    - name: Install XcodeGen
      script: 'brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

        '
    - name: Generate Xcode project
      script: 'xcodegen generate

        '
    - name: Compile for iPhone (unsigned, diagnostic only)
      script: "set -o pipefail\nxcodebuild -project VeepooHealthBridge.xcodeproj \\\n  -scheme VeepooHealthBridge \\\n  -configuration\
        \ Release \\\n  -sdk iphoneos \\\n  -destination 'generic/platform=iOS' \\\n  -derivedDataPath \"$CM_BUILD_DIR/derived\" \\\n\
        \  CODE_SIGNING_ALLOWED=NO build 2>&1 | tee \"$CM_BUILD_DIR/ios-build.log\"\n"
    - name: Compile iOS Simulator
      script: "set -o pipefail\nxcodebuild -project VeepooHealthBridge.xcodeproj \\\n  -scheme VeepooHealthBridge \\\n  -configuration\
        \ Debug \\\n  -sdk iphonesimulator \\\n  -destination 'generic/platform=iOS Simulator' \\\n  -derivedDataPath \"$CM_BUILD_DIR/derived-simulator\"\
        \ \\\n  CODE_SIGNING_ALLOWED=NO build 2>&1 | tee \"$CM_BUILD_DIR/simulator-build.log\"\n"
    artifacts:
    - ios-build.log
    - simulator-build.log
    - derived/Build/Products/Release-iphoneos/*.app
    - derived-simulator/Build/Products/Debug-iphonesimulator/*.app
  ios-veepoo-sdk:
    name: Veepoo Bridge - SDK real iPhone (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.4
    scripts:
    - name: Prepare pinned official Veepoo SDK 2.2.110.15
      script: bash scripts/prepare-vendor.sh
    - name: Compile app with actual Veepoo SDK for iPhone
      script: "set -o pipefail\nxcodebuild -workspace VeepooHealthBridge.xcworkspace \\\n  -scheme VeepooHealthBridge \\\n  -configuration\
        \ Debug \\\n  -sdk iphoneos \\\n  -destination 'generic/platform=iOS' \\\n  -derivedDataPath \"$CM_BUILD_DIR/derived-vendor\"\
        \ \\\n  CODE_SIGNING_ALLOWED=NO build 2>&1 | tee \"$CM_BUILD_DIR/vendor-build.log\"\n"
    - name: Package unsigned IPA for external personal signing
      script: 'set -euo pipefail

        APP="$CM_BUILD_DIR/derived-vendor/Build/Products/Debug-iphoneos/VeepooHealthBridge.app"

        test -d "$APP"

        test -f "$APP/Info.plist"

        test -f "$APP/VeepooHealthBridge"

        mkdir -p "$CM_BUILD_DIR/ipa-staging/Payload"

        ditto "$APP" "$CM_BUILD_DIR/ipa-staging/Payload/VeepooHealthBridge.app"

        cd "$CM_BUILD_DIR/ipa-staging"

        /usr/bin/zip -qry "$CM_BUILD_DIR/VeepooHealthBridge-UNSIGNED.ipa" Payload

        /usr/bin/unzip -tq "$CM_BUILD_DIR/VeepooHealthBridge-UNSIGNED.ipa"

        echo "Created unsigned IPA. This archive MUST be signed/provisioned before installation."

        '
    artifacts:
    - vendor-build.log
    - VeepooHealthBridge-UNSIGNED.ipa
    - derived-vendor/Build/Products/Debug-iphoneos/VeepooHealthBridge.app/**
  ios-testflight-candidate:
    name: Veepoo Bridge - signed TestFlight candidate
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.veepoobridge.ios
    scripts:
    - name: Prepare pinned official Veepoo SDK 2.2.110.15
      script: bash scripts/prepare-vendor.sh
    - name: Test conversion and validation core
      script: swift test --parallel
    - name: Apply authorized provisioning profiles
      script: xcode-project use-profiles
    - name: Build signed archive and IPA
      script: xcode-project build-ipa --workspace "$CM_BUILD_DIR/VeepooHealthBridge.xcworkspace" --scheme VeepooHealthBridge
    - name: Verify signed HealthKit entitlement
      script: 'set -euo pipefail

        IPA=$(find build/ios/ipa -name ''*.ipa'' -print -quit)

        test -n "$IPA"

        unzip -q "$IPA" -d signed-validation

        APP=$(find signed-validation/Payload -maxdepth 1 -name ''*.app'' -print -quit)

        codesign --verify --deep --strict "$APP"

        codesign -d --entitlements :- "$APP" > signed-entitlements.plist

        /usr/libexec/PlistBuddy -c ''Print :com.apple.developer.healthkit'' signed-entitlements.plist | grep -qx true

        security cms -D -i "$APP/embedded.mobileprovision" > signed-profile.plist

        /usr/libexec/PlistBuddy -c ''Print :Entitlements:com.apple.developer.healthkit'' signed-profile.plist | grep -qx true

        '
    artifacts:
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    integrations:
      app_store_connect: Veepoo Apple Developer
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
