name: VeepooHealthBridge
options:
  bundleIdPrefix: org.veepoobridge
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  VeepooHealthBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources/VeepooBridge
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Veepoo Bridge
        NSBluetoothAlwaysUsageDescription: Buscar y conectar el reloj A2 de forma local.
        NSHealthUpdateUsageDescription: Escribir en Salud de Apple las mediciones verificadas y autorizadas por ti.
        NSHealthShareUsageDescription: Consultar los registros autorizados para evitar duplicados.
        UILaunchScreen: {}
    entitlements:
      path: VeepooHealthBridge.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.veepoobridge.ios
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
