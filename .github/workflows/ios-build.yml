name: iOS source and device build verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'project.yml'
      - 'Info.plist'
      - 'VeepooHealthBridge.entitlements'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test core with synthetic unit-test fixtures only
        run: swift test --parallel
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator
        run: |
          set -o pipefail
          xcodebuild -project VeepooHealthBridge.xcodeproj -scheme VeepooHealthBridge -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/derived" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-simulator.log
      - name: Build physical device (unsigned compile check)
        run: |
          set -o pipefail
          xcodebuild -project VeepooHealthBridge.xcodeproj -scheme VeepooHealthBridge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/derived" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-results
          path: |
            build-simulator.log
            build-device.log
          if-no-files-found: ignore
