name: iOS source and device build verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'project.yml'
      - 'Info.plist'
      - 'VeepooHealthBridge.entitlements'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test core with synthetic unit-test fixtures only
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee core-tests.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator
        run: |
          set -o pipefail
          xcodebuild -project VeepooHealthBridge.xcodeproj -scheme VeepooHealthBridge -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/derived" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-simulator.log
      - name: Build physical device (unsigned compile check)
        run: |
          set -o pipefail
          xcodebuild -project VeepooHealthBridge.xcodeproj -scheme VeepooHealthBridge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/derived" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log
      - name: Capture actual empty-state interface after successful builds
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" derived/Build/Products/Release-iphonesimulator/VeepooHealthBridge.app
          mkdir -p interface-captures
          for screen in home device history health settings; do
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" org.veepoobridge.ios "--screen=$screen" -AppleLanguages '(es)' -AppleLocale es_ES
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "interface-captures/$screen.png"
          done
      - name: Upload real simulator captures
        uses: actions/upload-artifact@v4
        with:
          name: real-interface-simulator
          path: interface-captures/*.png
          if-no-files-found: warn
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-results
          path: |
            core-tests.log
            build-simulator.log
            build-device.log
          if-no-files-found: ignore
