name: iOS build validation (Veepoo Bridge)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VeepooHealthBridge_v0_2_source.zip'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Swift source
        run: |
          unzip -q VeepooHealthBridge_v0_2_source.zip -d extracted
          test -f extracted/VeepooHealthBridge_v0_2/project.yml
      - name: Show Xcode environment
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile iOS simulator without signing
        working-directory: extracted/VeepooHealthBridge_v0_2
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild -project VeepooHealthBridge.xcodeproj -scheme VeepooHealthBridge -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: extracted/VeepooHealthBridge_v0_2/xcodebuild.log
          if-no-files-found: ignore
