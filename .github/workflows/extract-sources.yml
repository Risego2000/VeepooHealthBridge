name: Inspect archived v0.2 source (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List historical archive without overwriting current source
        run: unzip -l VeepooHealthBridge_v0_2_source.zip
