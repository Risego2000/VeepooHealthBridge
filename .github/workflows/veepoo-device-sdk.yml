name: Veepoo SDK device integration check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veepoo-device-sdk.yml'
      - 'Sources/**'
      - 'codemagic.yaml'
      - 'project.yml'
permissions:
  contents: read
jobs:
  integrate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Obtain official vendor framework
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/HBandSDK/iOS_Ble_SDK.git /tmp/veepoo-vendor
          git -C /tmp/veepoo-vendor checkout c1ec1363c659deaa483778315b86e680f8f81af0
          mkdir -p Vendor
          cp -R /tmp/veepoo-vendor/iOS_sdk_source/Framework/2.0.43.15/VeepooBleSDK.framework Vendor/
          cp -R /tmp/veepoo-vendor/iOS_sdk_source/Demo/VeepooBleSDKDemo/VeepooBleSDKDemo/GRDFUSDK.framework Vendor/
          file Vendor/VeepooBleSDK.framework/VeepooBleSDK
          lipo -info Vendor/VeepooBleSDK.framework/VeepooBleSDK
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Inject framework into generated project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.yml')
          s=p.read_text()
          s=s.replace('    settings:\n      base:\n        PRODUCT_BUNDLE_IDENTIFIER:', '    dependencies:\n      - framework: Vendor/VeepooBleSDK.framework\n        embed: false\n      - framework: Vendor/GRDFUSDK.framework\n        embed: false\n    settings:\n      base:\n        PRODUCT_BUNDLE_IDENTIFIER:')
          p.write_text(s)
          PY
          xcodegen generate
      - name: Install vendor dependency pods
        shell: bash
        run: |
          cat > Podfile <<'PODS'
          platform :ios, '17.0'
          use_frameworks!
          target 'VeepooHealthBridge' do
            pod 'AFNetworking', '~> 4.0'
            pod 'FMDB', '~> 2.7'
            pod 'iOSDFULibrary'
          end
          PODS
          pod install
      - name: Compile actual SDK import for iOS device
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace VeepooHealthBridge.xcworkspace -scheme VeepooHealthBridge -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee vendor-device-build.log
      - name: Validate privacy usage descriptions in built app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphoneos/VeepooHealthBridge.app' -type d -print -quit)
          test -n "$APP"
          for key in NSBluetoothAlwaysUsageDescription NSHealthShareUsageDescription NSHealthUpdateUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist"
          done
      - name: Create unsigned IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphoneos/VeepooHealthBridge.app' -type d -print -quit)
          test -n "$APP"
          test -f "$APP/Info.plist"
          mkdir -p ipa-staging/Payload
          ditto "$APP" ipa-staging/Payload/VeepooHealthBridge.app
          cd ipa-staging
          zip -qry ../VeepooHealthBridge-UNSIGNED.ipa Payload
          unzip -tq ../VeepooHealthBridge-UNSIGNED.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VeepooHealthBridge-UNSIGNED-IPA
          path: VeepooHealthBridge-UNSIGNED.ipa
          if-no-files-found: error
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veepoo-sdk-device-link-report
          path: vendor-device-build.log
          if-no-files-found: ignore
