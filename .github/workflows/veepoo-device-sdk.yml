name: Veepoo SDK device integration check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veepoo-device-sdk.yml'
      - 'Sources/**'
      - 'scripts/**'
      - 'codemagic.yaml'
      - 'project.yml'
permissions:
  contents: read
jobs:
  integrate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned official SDK 2.2.110.15 and dependencies
        run: bash scripts/prepare-vendor.sh
      - name: Compile actual SDK import for iOS device
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace VeepooHealthBridge.xcworkspace -scheme VeepooHealthBridge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee vendor-device-build.log
      - name: Validate privacy usage descriptions in built app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/VeepooHealthBridge.app' -type d -print -quit)
          test -n "$APP"
          for key in NSBluetoothAlwaysUsageDescription NSHealthShareUsageDescription NSHealthUpdateUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist"
          done
      - name: Create unsigned IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/VeepooHealthBridge.app' -type d -print -quit)
          test -n "$APP"
          test -f "$APP/Info.plist"
          mkdir -p ipa-staging/Payload
          ditto "$APP" ipa-staging/Payload/VeepooHealthBridge.app
          cd ipa-staging
          zip -qry ../VeepooHealthBridge-UNSIGNED.ipa Payload
          unzip -tq ../VeepooHealthBridge-UNSIGNED.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VeepooHealthBridge-UNSIGNED-IPA
          path: VeepooHealthBridge-UNSIGNED.ipa
          if-no-files-found: error
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veepoo-sdk-device-link-report
          path: vendor-device-build.log
          if-no-files-found: ignore
